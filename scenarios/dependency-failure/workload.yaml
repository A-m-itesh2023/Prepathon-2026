apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: rca-demo
  labels: {app: database}
spec:
  replicas: 1
  selector: {matchLabels: {app: database}}
  template:
    metadata: {labels: {app: database}}
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["sh","-c","echo database unavailable; exit 1"]
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: rca-demo
spec:
  selector: {app: database}
  ports: [{port: 5432,targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-api
  namespace: rca-demo
  labels: {app: dependency-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: dependency-api}}
  template:
    metadata: {labels: {app: dependency-api}}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh","-c"]
        args: ["while true; do echo 'ERROR database connection refused: checkout cannot reach dependency'; sleep 5; done"]
